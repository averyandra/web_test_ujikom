<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Uji Kompetensi TKJ - Seleksi Paket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .option-label { transition: all 0.2s ease-in-out; }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 pb-24 relative min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">Simulasi Ujian TKJ</h1>
                <p class="text-indigo-200 text-sm" id="header-subtitle">Platform Simulasi Interaktif Server-Side</p>
            </div>
            <div id="header-stats" class="bg-indigo-800 px-3 py-1 rounded-full text-sm font-semibold hide">
                <span id="answered-count">0</span> / <span id="total-count">0</span> Terjawab
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow">
        
        <!-- View 0: Loading State -->
        <div id="loading-view" class="flex flex-col items-center justify-center mt-32">
            <svg class="animate-spin -ml-1 mr-3 h-12 w-12 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-slate-500 font-medium animate-pulse">Menghubungkan ke Database Soal...</p>
        </div>

        <!-- View 1: Package Selection -->
        <div id="package-view" class="max-w-4xl mx-auto px-4 py-12 hide fade-in">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-slate-800 mb-3">Pilih Paket Ujian</h2>
                <p class="text-slate-500">Pilih modul simulasi yang ingin Anda kerjakan hari ini.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="package-list">
                <!-- Package Cards Injected Here via JS -->
            </div>
        </div>

        <!-- View 2: Quiz Area -->
        <div id="quiz-view" class="max-w-4xl mx-auto px-4 py-8 hide fade-in">
            <div id="quiz-container">
                <!-- Questions Injected Here -->
            </div>
        </div>
    </main>

    <!-- Sticky Bottom Bar (Only for Quiz View) -->
    <div id="bottom-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 z-40 hide">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-4">
            <button id="btn-back-packages" class="text-indigo-600 font-medium hover:text-indigo-800 transition">
                &larr; Ganti Paket
            </button>
            <button id="btn-submit" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-lg shadow-lg transition duration-200">
                Selesai & Cek Skor
            </button>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex items-center justify-center hide opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="alert-box">
            <h3 class="text-lg font-bold text-slate-800 mb-2" id="alert-title">Perhatian</h3>
            <p class="text-slate-600 mb-6" id="alert-message">Pesan disini</p>
            <div class="flex justify-end gap-3">
                <button id="btn-alert-cancel" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition hide">Batal</button>
                <button id="btn-alert-ok" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">OK</button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-slate-900 bg-opacity-80 z-50 flex items-center justify-center hide opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 text-center">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 mb-2">Ujian Selesai!</h2>
            <p class="text-slate-600 mb-6">Berikut adalah skor pencapaian Anda:</p>
            <div class="text-5xl font-black text-indigo-600 mb-2" id="final-score">0</div>
            <p class="text-sm font-medium text-slate-500 mb-8" id="score-detail">0 Benar</p>
            <div class="flex flex-col gap-3">
                <button id="btn-review" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                    Lihat Pembahasan
                </button>
                <button id="btn-return-home" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-lg transition duration-200">
                    Kembali ke Daftar Paket
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global State variables
        let allPackages = [];
        let currentQuizData = [];
        let answers = {};
        let isSubmitted = false;
        let activePackageId = null;

        // UI Elements
        const loadingView = document.getElementById('loading-view');
        const packageView = document.getElementById('package-view');
        const quizView = document.getElementById('quiz-view');
        const bottomBar = document.getElementById('bottom-bar');
        const quizContainer = document.getElementById('quiz-container');
        
        const headerSubtitle = document.getElementById('header-subtitle');
        const headerStats = document.getElementById('header-stats');
        const answeredCountEl = document.getElementById('answered-count');
        const totalCountEl = document.getElementById('total-count');

        // Modal Elements
        const alertModal = document.getElementById('alert-modal');
        const alertBox = document.getElementById('alert-box');
        const alertTitle = document.getElementById('alert-title');
        const alertMessage = document.getElementById('alert-message');
        const btnAlertCancel = document.getElementById('btn-alert-cancel');
        const btnAlertOk = document.getElementById('btn-alert-ok');
        
        const resultModal = document.getElementById('result-modal');
        const finalScoreEl = document.getElementById('final-score');
        const scoreDetailEl = document.getElementById('score-detail');
        let alertCallback = null;

        // Fetch JSON Data from Server on Load
        document.addEventListener('DOMContentLoaded', loadPackages);

        async function loadPackages() {
            try {
                // Gunakan path relatif agar bisa diakses jika di-deploy ke server
                const response = await fetch('questions.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data && data.packages) {
                    allPackages = data.packages;
                    renderPackageSelection();
                } else {
                    throw new Error("Format JSON tidak valid.");
                }

            } catch (error) {
                console.error("Fetch Error:", error);
                loadingView.classList.add('hide');
                showAlert('Koneksi Gagal', 'Gagal memuat file questions.json. Pastikan file JSON berada di folder yang sama dengan file HTML ini di server Anda (CORS issue jika di-run secara lokal tanpa server).', false);
            }
        }

        // Render Package Cards
        function renderPackageSelection() {
            loadingView.classList.add('hide');
            packageView.classList.remove('hide');
            
            const packageListEl = document.getElementById('package-list');
            let html = '';

            allPackages.forEach(pkg => {
                const questionCount = pkg.questions ? pkg.questions.length : 0;
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between transition-all hover:shadow-md hover:border-indigo-300">
                        <div>
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">${questionCount} Soal</span>
                            </div>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">${pkg.name}</h3>
                            <p class="text-slate-500 text-sm mb-6">${pkg.description}</p>
                        </div>
                        <button onclick="selectPackage('${pkg.id}')" class="w-full bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white font-semibold py-3 px-4 rounded-xl transition duration-200">
                            Mulai Simulasi
                        </button>
                    </div>
                `;
            });

            packageListEl.innerHTML = html;
        }

        // Start Quiz from Selected Package
        window.selectPackage = function(packageId) {
            const selectedPackage = allPackages.find(p => p.id === packageId);
            if (!selectedPackage || !selectedPackage.questions || selectedPackage.questions.length === 0) {
                showAlert('Info', 'Paket ini belum memiliki soal.', false);
                return;
            }

            // Reset States
            activePackageId = packageId;
            currentQuizData = selectedPackage.questions;
            answers = {};
            isSubmitted = false;

            // Update UI Views
            packageView.classList.add('hide');
            quizView.classList.remove('hide');
            bottomBar.classList.remove('hide');
            
            // Update Header
            headerSubtitle.textContent = selectedPackage.name;
            headerStats.classList.remove('hide');
            totalCountEl.textContent = currentQuizData.length;
            answeredCountEl.textContent = 0;

            // Reset Bottom Bar Button Status
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.textContent = "Selesai & Cek Skor";
            btnSubmit.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
            btnSubmit.classList.add('bg-indigo-600', 'hover:bg-indigo-700');

            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Render Questions for the active package
        function renderQuestions() {
            let html = '';
            currentQuizData.forEach((item, qIndex) => {
                let optionsHtml = '';
                item.options.forEach((opt, oIndex) => {
                    optionsHtml += `
                        <label class="option-label block w-full p-4 mb-3 border-2 border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 hover:border-indigo-300" id="label-${qIndex}-${oIndex}">
                            <div class="flex items-center">
                                <div class="w-6 h-6 border-2 border-slate-300 rounded-full flex justify-center items-center mr-3" id="radio-bg-${qIndex}-${oIndex}">
                                    <div class="w-3 h-3 rounded-full bg-transparent" id="radio-dot-${qIndex}-${oIndex}"></div>
                                </div>
                                <span class="text-slate-700 font-medium">${opt}</span>
                            </div>
                            <input type="radio" name="q${qIndex}" value="${oIndex}" class="hidden" onchange="answerOption(${qIndex}, ${oIndex})">
                        </label>
                    `;
                });

                html += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8 transition-all hover:shadow-md" id="card-${qIndex}">
                        <div class="flex gap-4 mb-6">
                            <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-lg flex items-center justify-center font-bold flex-shrink-0">
                                ${qIndex + 1}
                            </div>
                            <h2 class="text-lg font-semibold text-slate-800 leading-relaxed">${item.q}</h2>
                        </div>
                        <div class="ml-0 md:ml-14">
                            ${optionsHtml}
                            
                            <div id="exp-${qIndex}" class="hide mt-4 p-4 bg-blue-50 border border-blue-100 rounded-xl">
                                <div class="flex items-start gap-3">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <div>
                                        <span class="font-bold text-blue-800 text-sm uppercase tracking-wide">Pembahasan:</span>
                                        <p class="text-slate-700 text-sm mt-1 leading-relaxed">${item.exp}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            quizContainer.innerHTML = html;
        }

        // Handle User Answer Selection
        window.answerOption = function(qIndex, oIndex) {
            if (isSubmitted) return; 

            answers[qIndex] = oIndex;
            answeredCountEl.textContent = Object.keys(answers).length;

            // Reset UI for this question options
            currentQuizData[qIndex].options.forEach((_, idx) => {
                const label = document.getElementById(`label-${qIndex}-${idx}`);
                const bg = document.getElementById(`radio-bg-${qIndex}-${idx}`);
                const dot = document.getElementById(`radio-dot-${qIndex}-${idx}`);
                
                label.classList.remove('border-indigo-600', 'bg-indigo-50');
                label.classList.add('border-slate-200');
                bg.classList.remove('border-indigo-600');
                bg.classList.add('border-slate-300');
                dot.classList.remove('bg-indigo-600');
                dot.classList.add('bg-transparent');
            });

            // Set Active UI for selected option
            const activeLabel = document.getElementById(`label-${qIndex}-${oIndex}`);
            const activeBg = document.getElementById(`radio-bg-${qIndex}-${oIndex}`);
            const activeDot = document.getElementById(`radio-dot-${qIndex}-${oIndex}`);
            
            activeLabel.classList.remove('border-slate-200');
            activeLabel.classList.add('border-indigo-600', 'bg-indigo-50');
            activeBg.classList.remove('border-slate-300');
            activeBg.classList.add('border-indigo-600');
            activeDot.classList.remove('bg-transparent');
            activeDot.classList.add('bg-indigo-600');
        };

        // Submit Logic
        document.getElementById('btn-submit').addEventListener('click', () => {
            if (isSubmitted) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            const answeredCount = Object.keys(answers).length;
            const total = currentQuizData.length;

            if (answeredCount < total) {
                showAlert("Peringatan", `Anda baru menjawab ${answeredCount} dari ${total} soal. Yakin ingin mengakhiri ujian?`, true, (confirmed) => {
                    if (confirmed) calculateAndShowResult();
                });
            } else {
                calculateAndShowResult();
            }
        });

        // Grading Logic
        function calculateAndShowResult() {
            isSubmitted = true;
            let correctCount = 0;

            currentQuizData.forEach((item, qIndex) => {
                const userAns = answers[qIndex];
                const isCorrect = userAns === item.ans;

                if (isCorrect) correctCount++;

                // Show Explanation
                document.getElementById(`exp-${qIndex}`).classList.remove('hide');

                // Disable clicks and Style logic
                item.options.forEach((_, oIndex) => {
                    const label = document.getElementById(`label-${qIndex}-${oIndex}`);
                    label.classList.remove('cursor-pointer', 'hover:bg-slate-50', 'hover:border-indigo-300');
                    label.style.pointerEvents = 'none';

                    if (oIndex === item.ans) {
                        label.classList.remove('border-slate-200', 'border-indigo-600', 'bg-indigo-50');
                        label.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                        document.getElementById(`radio-dot-${qIndex}-${oIndex}`).classList.add('bg-emerald-600');
                        document.getElementById(`radio-bg-${qIndex}-${oIndex}`).classList.add('border-emerald-600');
                    } else if (userAns === oIndex && !isCorrect) {
                        label.classList.remove('border-slate-200', 'border-indigo-600', 'bg-indigo-50');
                        label.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
                        document.getElementById(`radio-dot-${qIndex}-${oIndex}`).classList.add('bg-red-600');
                        document.getElementById(`radio-bg-${qIndex}-${oIndex}`).classList.add('border-red-600');
                    }
                });
            });

            // Show Score
            const score = Math.round((correctCount / currentQuizData.length) * 100);
            finalScoreEl.textContent = score;
            scoreDetailEl.textContent = `${correctCount} Benar dari ${currentQuizData.length} Soal`;
            
            resultModal.classList.remove('hide');
            setTimeout(() => resultModal.classList.remove('opacity-0'), 10);

            // Update Submit Button State
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.textContent = "Gulir ke Atas";
            btnSubmit.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            btnSubmit.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
        }

        // Navigation Controllers
        document.getElementById('btn-review').addEventListener('click', () => {
            resultModal.classList.add('opacity-0');
            setTimeout(() => {
                resultModal.classList.add('hide');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        });

        const goHome = () => {
            // Confirm if taking quiz
            if (!isSubmitted && Object.keys(answers).length > 0) {
                showAlert("Perhatian", "Progres ujian Anda akan hilang. Yakin ingin mengganti paket?", true, (confirmed) => {
                    if (confirmed) resetToHome();
                });
            } else {
                resetToHome();
            }
        };

        function resetToHome() {
            // Close Modals if open
            resultModal.classList.add('opacity-0');
            
            setTimeout(() => {
                resultModal.classList.add('hide');
                
                // Hide Quiz, Show Packages
                quizView.classList.add('hide');
                bottomBar.classList.add('hide');
                packageView.classList.remove('hide');
                
                // Reset Headers
                headerSubtitle.textContent = "Platform Simulasi Interaktif Server-Side";
                headerStats.classList.add('hide');
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        document.getElementById('btn-return-home').addEventListener('click', goHome);
        document.getElementById('btn-back-packages').addEventListener('click', goHome);

        // Alert Utility Functions
        function showAlert(title, message, isConfirm = false, callback = null) {
            alertTitle.textContent = title;
            alertMessage.textContent = message;
            alertModal.classList.remove('hide');
            
            setTimeout(() => {
                alertModal.classList.remove('opacity-0');
                alertBox.classList.remove('scale-95');
                alertBox.classList.add('scale-100');
            }, 10);

            if (isConfirm) {
                btnAlertCancel.classList.remove('hide');
            } else {
                btnAlertCancel.classList.add('hide');
            }
            alertCallback = callback;
        }

        function closeAlert() {
            alertModal.classList.add('opacity-0');
            alertBox.classList.remove('scale-100');
            alertBox.classList.add('scale-95');
            setTimeout(() => alertModal.classList.add('hide'), 300);
        }

        btnAlertOk.addEventListener('click', () => {
            closeAlert();
            if (alertCallback) alertCallback(true);
        });

        btnAlertCancel.addEventListener('click', () => {
            closeAlert();
            if (alertCallback) alertCallback(false);
        });

    </script>
</body>
</html>
