<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Evaluasi Jaringan Berbasis CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="mb-8 border-b border-slate-200 pb-4">
            <h1 class="text-3xl font-bold text-slate-900">Platform Simulasi Uji Kompetensi TKJ</h1>
            <p class="text-slate-600 mt-2">Arsitektur Modular: Frontend dinamis membaca data soal dari struktur JSON eksternal.</p>
        </header>

        <main id="app-container">
            <!-- Loading Indicator -->
            <div id="loading" class="text-center py-10 hidden">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-900 mx-auto"></div>
                <p class="mt-4 text-slate-600">Mengambil paket soal dari server...</p>
            </div>

            <!-- Error Message -->
            <div id="error-msg" class="hidden bg-red-100 border border-red-300 text-red-700 p-4 rounded-lg mb-6"></div>

            <!-- Package Selection -->
            <div id="package-list" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <!-- Dimuat oleh JS -->
            </div>

            <!-- Quiz Area -->
            <div id="quiz-area" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <button onclick="backToMenu()" class="text-sm font-medium text-blue-600 hover:text-blue-800 mb-6 flex items-center gap-1">
                    &larr; Kembali ke Indeks
                </button>
                <div class="mb-6 border-b border-slate-100 pb-4">
                    <h2 id="quiz-title" class="text-2xl font-bold text-slate-800"></h2>
                    <p id="quiz-desc" class="text-slate-500 mt-1"></p>
                </div>

                <div id="question-container" class="mb-8 min-h-[200px]"></div>

                <div class="flex justify-between items-center mt-6 border-t border-slate-100 pt-6">
                    <button id="prev-btn" onclick="prevQuestion()" class="bg-slate-100 text-slate-700 font-medium px-5 py-2.5 rounded-lg hover:bg-slate-200 disabled:opacity-40 transition">Sebelumnya</button>
                    <span id="question-tracker" class="font-semibold text-slate-500 text-sm tracking-wide"></span>
                    <button id="next-btn" onclick="nextQuestion()" class="bg-slate-800 text-white font-medium px-5 py-2.5 rounded-lg shadow hover:bg-slate-700 transition">Selanjutnya</button>
                </div>
            </div>

            <!-- Result Area -->
            <div id="result-area" class="hidden bg-white p-6 md:p-10 rounded-xl shadow-sm border border-slate-200 text-center">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6">
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">Selesai!</h2>
                <p class="text-lg text-slate-600 mb-8">Anda telah menyelesaikan tes. Berikut adalah ringkasan teknis dari evaluasi ini.</p>
                
                <div class="inline-block bg-slate-50 border border-slate-200 rounded-xl px-10 py-6 mb-8">
                    <p class="text-sm text-slate-500 uppercase tracking-widest font-semibold mb-1">Skor Total</p>
                    <p class="text-5xl font-black text-slate-800"><span id="final-score" class="text-blue-600"></span><span class="text-2xl text-slate-400"> / <span id="max-score"></span></span></p>
                </div>

                <div id="review-container" class="mt-4 text-left custom-scrollbar"></div>

                <div class="mt-10">
                    <button onclick="backToMenu()" class="bg-slate-800 text-white font-medium px-8 py-3 rounded-lg shadow hover:bg-slate-700 transition">Kembali ke Daftar Paket</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let score = 0;

        const ui = {
            loading: document.getElementById('loading'),
            error: document.getElementById('error-msg'),
            pkgList: document.getElementById('package-list'),
            quiz: document.getElementById('quiz-area'),
            result: document.getElementById('result-area')
        };

        async function initApp() {
            ui.loading.classList.remove('hidden');
            try {
                // Fetch daftar paket (indeks logikal)
                const res = await fetch('packages.json');
                if (!res.ok) throw new Error('File packages.json tidak ditemukan atau terjadi masalah jaringan.');
                const packages = await res.json();
                renderPackages(packages);
            } catch(e) {
                ui.error.innerHTML = `<strong>Kegagalan Sinkronisasi:</strong> ${e.message}<br><span class="text-sm">Sistem ini menggunakan metode Fetch API yang mewajibkan lingkungan Web Server (HTTP/HTTPS) seperti Nginx, Apache, atau Uvicorn. Pastikan tidak dijalankan via protokol file://.</span>`;
                ui.error.classList.remove('hidden');
            } finally {
                ui.loading.classList.add('hidden');
            }
        }

        function renderPackages(packages) {
            ui.pkgList.innerHTML = '';
            packages.forEach(pkg => {
                const card = document.createElement('div');
                card.className = 'group bg-white p-6 rounded-xl border border-slate-200 hover:border-slate-300 hover:shadow-md transition cursor-pointer flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">\${pkg.id}</div>
                        <h3 class="text-xl font-bold text-slate-800 group-hover:text-blue-700 transition">\${pkg.title}</h3>
                        <p class="text-slate-600 mt-2 text-sm leading-relaxed">\${pkg.description}</p>
                    </div>
                    <div class="mt-6 border-t border-slate-100 pt-4 flex justify-between items-center text-sm font-medium text-slate-500">
                        <span>\${pkg.questionCount} Soal</span>
                        <button onclick="loadPackage('\${pkg.file}', '\${pkg.title}', '\${pkg.description}')" class="text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-4 py-2 rounded-lg">Mulai &rarr;</button>
                    </div>
                `;
                ui.pkgList.appendChild(card);
            });
        }

        async function loadPackage(filename, title, desc) {
            ui.pkgList.classList.add('hidden');
            ui.loading.classList.remove('hidden');
            ui.error.classList.add('hidden');

            try {
                const res = await fetch(filename);
                if(!res.ok) throw new Error(`HTTP Error: \${res.status} pada file \${filename}`);
                const data = await res.json();

                ui.loading.classList.add('hidden');
                ui.quiz.classList.remove('hidden');

                document.getElementById('quiz-title').textContent = title;
                document.getElementById('quiz-desc').textContent = desc;

                currentQuestions = data.questions;
                currentQuestionIndex = 0;
                userAnswers = {};
                score = 0;

                renderQuestion();
            } catch(e) {
                ui.loading.classList.add('hidden');
                ui.error.innerHTML = `<strong>Gagal Memuat Paket:</strong> ${e.message}<br><span class="text-sm">Pastikan file \${filename} terkonfigurasi dengan benar di root directory server Anda.</span>`;
                ui.error.classList.remove('hidden');
                ui.pkgList.classList.remove('hidden');
            }
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            const q = currentQuestions[currentQuestionIndex];

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const isChecked = userAnswers[currentQuestionIndex] === idx;
                optionsHtml += `
                    <label class="block p-4 border rounded-xl mb-3 cursor-pointer transition-colors \${isChecked ? 'bg-blue-50 border-blue-400 shadow-sm' : 'border-slate-200 hover:bg-slate-50'}">
                        <div class="flex items-start gap-4">
                            <div class="pt-1">
                                <input type="radio" name="option" value="\${idx}" class="w-5 h-5 text-blue-600 focus:ring-blue-500" onchange="selectOption(\${idx})" \${isChecked ? 'checked' : ''}>
                            </div>
                            <span class="text-slate-700 leading-relaxed font-medium">\${opt}</span>
                        </div>
                    </label>
                `;
            });

            container.innerHTML = `
                <div class="mb-6">
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 leading-snug">\${currentQuestionIndex + 1}. \${q.question}</h3>
                </div>
                <div>\${optionsHtml}</div>
            `;

            document.getElementById('question-tracker').textContent = \`SOAL \${currentQuestionIndex + 1} DARI \${currentQuestions.length}\`;
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;

            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.textContent = 'Kalkulasi Skor';
                nextBtn.classList.remove('bg-slate-800', 'hover:bg-slate-700');
                nextBtn.classList.add('bg-green-600', 'hover:bg-green-700');
            } else {
                nextBtn.textContent = 'Selanjutnya';
                nextBtn.classList.add('bg-slate-800', 'hover:bg-slate-700');
                nextBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
            }
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                calculateResult();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function calculateResult() {
            score = 0;
            let reviewHtml = '<div class="mt-6 border-t border-slate-200 pt-8"><h3 class="text-xl font-bold mb-6 text-slate-800">Analisis dan Penjelasan</h3><div class="space-y-6">';

            currentQuestions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.answer;
                if (isCorrect) score++;

                const bgClass = isCorrect ? 'bg-green-50/50 border-green-200' : 'bg-red-50/50 border-red-200';
                const statusLabel = isCorrect 
                    ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-bold text-green-700 bg-green-100 rounded-md">Jawaban Benar</span>' 
                    : '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-bold text-red-700 bg-red-100 rounded-md">Kesalahan Teori</span>';

                let userAnsText = userAns !== undefined ? q.options[userAns] : '<i>(Tidak dijawab)</i>';

                reviewHtml += `
                    <div class="p-5 border rounded-xl shadow-sm \${bgClass}">
                        <div class="flex items-start justify-between gap-4 mb-3">
                            <p class="font-bold text-slate-800 leading-snug">\${idx + 1}. \${q.question}</p>
                            <div>\${statusLabel}</div>
                        </div>
                        <div class="pl-4 border-l-2 \${isCorrect ? 'border-green-400' : 'border-red-400'} mb-4 text-sm text-slate-700">
                            Pilihan Anda: <strong class="\${isCorrect ? 'text-green-800' : 'text-red-800'}">\${userAnsText}</strong>
                            \${!isCorrect ? \`<br>Jawaban Sistem: <strong class="text-green-700">\${q.options[q.answer]}</strong>\` : ''}
                        </div>
                        <div class="bg-white p-4 rounded-lg border border-slate-200 text-sm text-slate-600 leading-relaxed shadow-sm">
                            <strong class="text-slate-800 uppercase text-xs tracking-wider border-b border-slate-200 pb-1 mb-2 inline-block">Pembahasan Teknis</strong><br>
                            \${q.explanation}
                        </div>
                    </div>
                `;
            });
            reviewHtml += '</div></div>';

            ui.quiz.classList.add('hidden');
            ui.result.classList.remove('hidden');

            document.getElementById('final-score').textContent = score;
            document.getElementById('max-score').textContent = currentQuestions.length;
            document.getElementById('review-container').innerHTML = reviewHtml;
        }

        function backToMenu() {
            ui.quiz.classList.add('hidden');
            ui.result.classList.add('hidden');
            ui.pkgList.classList.remove('hidden');
        }

        initApp();
    </script>
</body>
</html>
